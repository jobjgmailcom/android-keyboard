name: Android build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unstable debug APK
    runs-on: ubuntu-24.04
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.30-${{ github.run_number }}
      BRANCH_NAME: ${{ github.ref_name }}
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform, NDK and CMake
        run: sdkmanager --install "platforms;android-35" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace assembleUnstableDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: futo-keyboard-unstable-debug-${{ github.sha }}
          path: build/outputs/apk/unstable/debug/*.apk
          if-no-files-found: error
          retention-days: 14
